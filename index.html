<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Secretpass · %VITE_OPERATION_MODE%</title>
        <meta name="description" content="Encrypt and decrypt your secrets with your passkey on your device, store encrypted secrets in your codebase or on a our hosted service." />
        <script>
            let theme = localStorage.getItem('ui-theme') || "system";
            if(theme === "system") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }

            document.documentElement.setAttribute("data-theme", theme)
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script src="/src/main.tsx" type="module"></script>
    </body>
</html>
